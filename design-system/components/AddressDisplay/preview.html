<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><title>AddressDisplay — preview</title>
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:20px;padding:var(--space-16);}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--font-mono)}
  .muted{color:var(--text-secondary)}
  .btn{height:var(--control-md);padding:0 var(--space-16);border-radius:var(--radius-md);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-8)}
  .btn-primary{background:var(--interactive);color:var(--text-on-interactive);border:1px solid var(--interactive)}
  .btn-secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border-strong)}
  .btn-ghost{background:transparent;color:var(--link);border:1px solid transparent}
  .focus{outline:2px solid var(--focus);outline-offset:2px}
  .tag{display:inline-flex;align-items:center;gap:var(--space-4);height:24px;padding:0 var(--space-8);border-radius:var(--radius-pill);font-size:12px;line-height:16px;letter-spacing:.32px;border:1px solid currentColor}
  svg.i{width:var(--icon-16);height:var(--icon-16);flex:none}
</style>
<style>
.a{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap;margin-bottom:var(--space-16)}
.name{font-weight:600}
.addr{font-family:var(--font-mono);color:var(--text-secondary)} .addr b{font-weight:400;color:var(--text-primary)}
.ok{color:var(--support-success);display:inline-flex;gap:var(--space-4);align-items:center;font-size:12px}
.btn{height:var(--control-sm);padding:0 var(--space-8);font-weight:400}
</style>
</head>
<body>
<div class="a"><span class="name">Weather API</span><span class="addr"><b>0x8f3a</b> … <b>7d04</b></span><button class="btn btn-ghost" aria-label="Copy full address"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Copy</button></div>
<div class="a"><span class="addr"><b>0x8f3a</b> 2c91 04b7 e65d 1a0c 3f88 b2e9 4d77 16a5 c0e3 f2b8 d491 c6e0 7a53 b9f1 <b>7d04</b></span></div>
<div class="a"><span class="ok"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8.2l2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Format valid</span><span class="muted" style="font-size:12px">Compare the first and last groups with your wallet before you sign.</span></div>
</body>
</html>
