<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><title>TestNetworkBadge — preview</title>
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:20px;padding:var(--space-16);}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--font-mono)}
  .muted{color:var(--text-secondary)}
  .btn{height:var(--control-md);padding:0 var(--space-16);border-radius:var(--radius-md);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-8)}
  .btn-primary{background:var(--interactive);color:var(--text-on-interactive);border:1px solid var(--interactive)}
  .btn-secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border-strong)}
  .btn-ghost{background:transparent;color:var(--link);border:1px solid transparent}
  .focus{outline:2px solid var(--focus);outline-offset:2px}
  .tag{display:inline-flex;align-items:center;gap:var(--space-4);height:24px;padding:0 var(--space-8);border-radius:var(--radius-pill);font-size:12px;line-height:16px;letter-spacing:.32px;border:1px solid currentColor}
  svg.i{width:var(--icon-16);height:var(--icon-16);flex:none}
</style>
<style>.hdr{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 var(--space-16);background:var(--layer);border:1px solid var(--border-subtle);border-radius:var(--radius-md);margin-bottom:var(--space-16)}
.name{font-size:20px;font-weight:600}
.net{background:var(--network-test);color:var(--text-on-network-test);border-color:transparent}</style>
</head>
<body>
<div class="hdr"><span class="name">Agency Lab</span><span class="tag net"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4M6.8 2v4.2L3 12.5A1 1 0 0 0 3.9 14h8.2a1 1 0 0 0 .9-1.5L9.2 6.2V2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Test money · Base Sepolia</span></div>
<span class="tag net"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4M6.8 2v4.2L3 12.5A1 1 0 0 0 3.9 14h8.2a1 1 0 0 0 .9-1.5L9.2 6.2V2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Test money · Base Sepolia</span>
</body>
</html>
