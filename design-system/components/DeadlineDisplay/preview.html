<!-- @dsCard group="Status" height=120 subtitle="A fixed date, never a ticking timer" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><title>DeadlineDisplay — preview</title>
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:20px;padding:var(--space-16);}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--font-mono)}
  .muted{color:var(--text-secondary)}
  .btn{height:var(--control-md);padding:0 var(--space-16);border-radius:var(--radius-md);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-8)}
  .btn-primary{background:var(--interactive);color:var(--text-on-interactive);border:1px solid var(--interactive)}
  .btn-secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border-strong)}
  .btn-ghost{background:transparent;color:var(--link);border:1px solid transparent}
  .focus{outline:2px solid var(--focus);outline-offset:2px}
  .tag{display:inline-flex;align-items:center;gap:var(--space-4);height:24px;padding:0 var(--space-8);border-radius:var(--radius-pill);font-size:12px;line-height:16px;letter-spacing:.32px;border:1px solid currentColor}
  svg.i{width:var(--icon-16);height:var(--icon-16);flex:none}
</style>
<style>.d{display:flex;gap:var(--space-8);align-items:center;margin-bottom:var(--space-12)}
.d time{font-variant-numeric:tabular-nums;font-weight:600}
.done{color:var(--text-secondary)}</style>
</head>
<body>
<div class="d"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Refund if not delivered by <time datetime="2026-11-05T20:00Z">Nov 5, 2026, 3:00 PM EST</time></span></div>
<div class="d done"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5L2.5 6.5l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 6.5H10a3.5 3.5 0 0 1 0 7H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Deadline passed · refunded <time datetime="2026-11-05T20:02Z">Nov 5, 2026, 3:02 PM EST</time></span></div>
</body>
</html>
