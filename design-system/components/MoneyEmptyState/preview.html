<!-- @dsCard group="States" height=250 subtitle="No data, no results, error" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><title>MoneyEmptyState — preview</title>
<style>
  html,body{margin:0}
  body{background:var(--background);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:20px;padding:var(--space-16);}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--font-mono)}
  .muted{color:var(--text-secondary)}
  .btn{height:var(--control-md);padding:0 var(--space-16);border-radius:var(--radius-md);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-8)}
  .btn-primary{background:var(--interactive);color:var(--text-on-interactive);border:1px solid var(--interactive)}
  .btn-secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border-strong)}
  .btn-ghost{background:transparent;color:var(--link);border:1px solid transparent}
  .focus{outline:2px solid var(--focus);outline-offset:2px}
  .tag{display:inline-flex;align-items:center;gap:var(--space-4);height:24px;padding:0 var(--space-8);border-radius:var(--radius-pill);font-size:12px;line-height:16px;letter-spacing:.32px;border:1px solid currentColor}
  svg.i{width:var(--icon-16);height:var(--icon-16);flex:none}
</style>
<style>.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-16)}
.e{background:var(--layer);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:var(--space-16)}
.e h3{margin:var(--space-8) 0 var(--space-4);font-size:16px;line-height:24px;font-weight:600}
.e p{margin:0 0 var(--space-12);color:var(--text-secondary)}
.err{color:var(--support-danger)}
svg.i{width:var(--icon-24);height:var(--icon-24)}</style>
</head>
<body>
<div class="row">
<div class="e"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><h3>No payments yet</h3><p>Your agent's payments will appear here.</p><button class="btn btn-primary">Make a test payment</button></div>
<div class="e"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><h3>No payments match "refund"</h3><p>Try another word or clear the filters.</p><button class="btn btn-secondary">Clear filters</button></div>
<div class="e"><span class="err"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><h3>Couldn't load your balance</h3><p>The blockchain didn't respond. Your money hasn't moved.</p><button class="btn btn-secondary">Try again</button></div>
</div>
</body>
</html>
