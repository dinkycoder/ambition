<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css">
<meta charset="utf-8">
<title>Ambition</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .tint { fill:var(--brand-tint); }
  .act { fill:var(--interactive); }
  .ink { fill:var(--brand-ink); }
  .net { fill:var(--network-test); }
  .dot { fill:var(--interactive); }
  .cut { fill:var(--background); }
  .blk { rx:var(--radius-lg); }
  .chip { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-24); bottom:var(--space-24); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:600; letter-spacing:-.02em; color:var(--text-primary); }
  .tag { margin:var(--space-12) 0 0 4px; font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>

<div class="cover">
